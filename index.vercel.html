<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Generate Adobe Stock titles, keywords and categories from your images using AI." />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" href="/src/assets/logo-icon.png" />
    <title>Learn Stock — AI metadata for Adobe Stock</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var key = "learnstockbatch1accesskey343";
        var storageKey = "learnstock.access.v1";
        var hash = window.location.hash || "";
        if (hash.indexOf("#access=") === 0) {
          var access = decodeURIComponent(hash.slice("#access=".length));
          if (access.trim().slice(0, 128) === key) {
            try {
              window.localStorage.setItem(storageKey, key);
            } catch (error) {}
            window.history.replaceState(null, "", "/app");
          } else {
            window.history.replaceState(null, "", "/app#invalid-access");
          }
        }
      })();
    </script>
    <script type="module" src="/src/vercel-client.tsx"></script>
  </body>
</html>
